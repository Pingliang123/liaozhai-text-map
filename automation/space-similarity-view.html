<!doctype html><meta charset="utf-8"><title>篇目空间词相似度</title><style>body{font:16px/1.6 system-ui;margin:24px;background:#faf9f5}canvas{max-width:100%;background:white;border:1px solid #ddd}input,select{padding:8px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}#tip{min-height:50px}</style><h1>篇目空间词相似度</h1><p>443篇有效，48篇无有效词项。选择篇名，查看最相似的篇目和共有词。没有进行主题分类或更改标注。</p><input id="search" placeholder="搜索篇名"><select id="chapter"></select><select id="metric"><option value="jaccard">Jaccard：共有词占比</option><option value="cosine">TF-IDF余弦：考虑词频与辨识性</option></select><p id="summary"></p><table><thead><tr><th>篇目</th><th>相似度</th><th>共有词</th></tr></thead><tbody id="rows"></tbody></table><h2>全书相似度热图</h2><p>悬停查看两篇及精确分数，点击格子查看该行篇目的近邻。按同一Jaccard层次顺序排列；对角线是自身。</p><label>显示范围：<select id="scope"><option value="local">所选篇目与最相似的20篇</option><option value="all">全书总览</option></select></label><p>局部图显示篇名；每格可悬停查看两篇与分数。</p><div style="overflow:auto"><canvas id="heat" width="443" height="443" style="width:850px;image-rendering:pixelated"></canvas></div><p id="tip"></p><h2>二维篇目分布</h2><canvas id="map" width="1000" height="650"></canvas><p>MDS近似1－Jaccard距离；与地理位置、时间顺序无关。悬停查看篇名，点击选篇。</p><p>Jaccard不计重复词；TF-IDF使用平滑IDF与L2归一化。未统一同义词，短篇高分应结合共有词数核查。</p><script>const D=PAYLOAD;
const $=id=>document.getElementById(id);let selected=D.chapters[0].id;
function options(){const q=$('search').value.trim();$('chapter').replaceChildren();for(const c of D.chapters.filter(c=>c.title.includes(q))){const o=document.createElement('option');o.value=c.id;o.textContent=c.title;$('chapter').append(o)}if([...$('chapter').options].some(o=>Number(o.value)===selected))$('chapter').value=selected;else if($('chapter').options.length)selected=Number($('chapter').value);show()}
function show(){const c=D.chapters.find(c=>c.id===selected);$('summary').textContent=`《${c.title}》：${c.words}种词，${c.tokens}词次；${c.words<5?'词项较少，请谨慎比较':''}`;$('rows').replaceChildren();for(const n of c.nearest[$('metric').value]){const tr=document.createElement('tr');for(const v of [n.title,n.similarity.toFixed(4),n.shared_words.join('、')]){const td=document.createElement('td');td.textContent=v;tr.append(td)}tr.onclick=()=>{selected=n.id;$('search').value='';options()};$('rows').append(tr)}heat();map()}
let visible=[],cellSize=24,margin=130;
function heat(){const local=$('scope').value==='local',selectedIndex=D.chapters.findIndex(c=>c.id===selected),mat=D[$('metric').value];visible=local?[selectedIndex,...D.chapters.map((c,i)=>i).filter(i=>i!==selectedIndex).sort((a,b)=>mat[selectedIndex][b]-mat[selectedIndex][a]).slice(0,20)]:D.order;cellSize=local?26:2;margin=local?135:5;const n=visible.length,canvas=$('heat');canvas.width=margin+n*cellSize;canvas.height=margin+n*cellSize;canvas.style.width=canvas.width+'px';const ctx=canvas.getContext('2d');ctx.font='12px system-ui';ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<n;i++){if(local){ctx.fillStyle='#25333d';ctx.textAlign='right';ctx.fillText(D.chapters[visible[i]].title,margin-8,margin+i*cellSize+17);ctx.save();ctx.translate(margin+i*cellSize+17,margin-8);ctx.rotate(-Math.PI/2);ctx.textAlign='left';ctx.fillText(D.chapters[visible[i]].title,0,0);ctx.restore();}for(let j=0;j<n;j++){const v=mat[visible[i]][visible[j]];ctx.fillStyle=`rgb(${Math.round(250-220*v)},${Math.round(250-140*v)},${Math.round(245-70*v)})`;ctx.fillRect(margin+j*cellSize,margin+i*cellSize,cellSize-Number(local),cellSize-Number(local));}}}
function cell(e){const r=$('heat').getBoundingClientRect();return [Math.floor(((e.clientY-r.top)*$('heat').height/r.height-margin)/cellSize),Math.floor(((e.clientX-r.left)*$('heat').width/r.width-margin)/cellSize)]}
$('heat').onmousemove=e=>{const[i,j]=cell(e);if(i<0||j<0||i>=visible.length||j>=visible.length)return;const a=visible[i],b=visible[j];$('tip').textContent=`《${D.chapters[a].title}》／《${D.chapters[b].title}》：${D[$('metric').value][a][b].toFixed(4)}`};$('heat').onclick=e=>{const[i]=cell(e);if(i>=0&&i<visible.length){selected=D.chapters[visible[i]].id;$('search').value='';options()}};
const xs=D.chapters.map(c=>c.x),ys=D.chapters.map(c=>c.y),xmin=Math.min(...xs),ymin=Math.min(...ys),scale=Math.min(900/(Math.max(...xs)-xmin),550/(Math.max(...ys)-ymin));const pos=c=>[50+(c.x-xmin)*scale,600-(c.y-ymin)*scale];
function map(){const ctx=$('map').getContext('2d');ctx.clearRect(0,0,1000,650);for(const c of D.chapters){const[x,y]=pos(c);ctx.beginPath();ctx.arc(x,y,c.id===selected?7:3,0,Math.PI*2);ctx.fillStyle=c.id===selected?'#cf572d':'#397d9a88';ctx.fill()}}
function nearest(e){const r=$('map').getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*650/r.height;return D.chapters.map(c=>{const[a,b]=pos(c);return {c,d:Math.hypot(a-x,b-y)}}).sort((a,b)=>a.d-b.d)[0]}
$('map').onmousemove=e=>{const n=nearest(e);if(n.d<15)$('tip').textContent=`《${n.c.title}》：${n.c.words}种词`};$('map').onclick=e=>{const n=nearest(e);if(n.d<15){selected=n.c.id;$('search').value='';options()}};$('search').oninput=options;$('chapter').onchange=()=>{selected=Number($('chapter').value);show()};$('metric').onchange=show;$('scope').onchange=heat;options();</script>
