name: Merge and publish map updates

on:
  push:
    paths:
      - 'updates/inbox/*.json'
      - 'automation/**'
      - 'index.html'
      - 'data-package.json'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical data repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge pending browser revisions
        shell: bash
        run: |
          set -euo pipefail
          files=(updates/inbox/*.json)
          if [ ! -e "${files[0]}" ]; then
            echo "No pending revision file; validating current release only."
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('data-package.json')); if(p.package_type!=='liaozhai-text-map'||!p.base||!p.revisions) throw new Error('invalid release package');"
          else
            for file in "${files[@]}"; do
              node automation/merge-revisions.js "$file"
              mkdir -p updates/processed
              mv "$file" "updates/processed/$(basename "$file" .json)-${GITHUB_SHA}.json"
            done
          fi
      - name: Verify release integrity
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('data-package.json')); if(p.base.chapter_overview.length!==491) throw new Error('chapter count changed'); if(!fs.readFileSync('index.html','utf8').includes('published-revisions')) throw new Error('seed missing');"
      - name: Commit generated cloud update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-package.json index.html updates/processed
          if git diff --cached --quiet; then echo 'No changes to publish.'; else git commit -m "自动合并人工修订并发布地图"; git push; fi
