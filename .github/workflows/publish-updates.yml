name: Validate revisions and publish map
on:
  push:
    branches: [main]
    paths:
      - manual-revisions.json
      - updates/inbox/*.json
      - automation/**
      - github-sync.js
      - github-login.js
      - github-sync-config.json
      - audit-reports.js
      - auth-backend/**
      - index.html
      - data-package.json
      - .github/workflows/publish-updates.yml
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: map-cloud-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and merge canonical revisions
        shell: bash
        run: |
          set -euo pipefail
          node automation/test-github-sync.js
          node automation/test-sync-size.js
          node automation/test-github-login.js
          node automation/test-region-scope.js
          node automation/test-chapter-references.js
          node automation/test-audit-reports.js
          node automation/test-audit-reports-dom.js
          node --test auth-backend/test-worker.mjs
          for file in updates/inbox/*.json; do
            [ -e "$file" ] || continue
            node automation/merge-revisions.js "$file"
            mkdir -p updates/processed
            git mv "$file" "updates/processed/$(basename "$file" .json)-${GITHUB_SHA}.json"
          done
          node automation/merge-revisions.js manual-revisions.json
          node automation/test-cloud-release.js
          python automation/finalize-cloud-release.py
      - name: Record regenerated release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual-revisions.json data-package.json index.html research-data.zip release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "更新人工修订资料包与发布版本"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public artifact
        shell: bash
        run: |
          mkdir public
          cp index.html data.html data-package.json manual-revisions.json research-data.zip release-manifest.json github-sync.js github-login.js github-sync-config.json audit-reports.js public/
          cp -r assets public/assets
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
