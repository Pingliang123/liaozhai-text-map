name: Validate revisions and publish map
on:
  push:
    branches: [main]
    paths:
      - manual-revisions.json
      - updates/inbox/*.json
      - automation/**
      - assets/**
      - reports/**
      - github-sync.js
      - github-login.js
      - github-sync-config.json
      - audit-reports.js
      - assets/data-loader.js
      - assets/place-review.js
      - assets/place-crosscheck.js
      - assets/corpus-store.js
      - assets/vocabulary-grid.*
      - assets/otherworld-map.js
      - assets/map-network-link.js
      - assets/research-lab/*.js
      - assets/research-lab/*.css
      - assets/research-lab/index.html
      - assets/research-lab/data.json
      - assets/research-lab/time-terms.json
      - auth-backend/**
      - index.html
      - data-package.json
      - data.html
      - assets/*.png
      - .github/workflows/publish-updates.yml
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: map-cloud-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements-network.txt
      - name: Validate and merge canonical revisions
        shell: bash
        run: |
          set -euo pipefail
          node automation/test-github-sync.js
          node automation/test-sync-size.js
          node automation/test-github-login.js
          node automation/test-region-scope.js
          node automation/test-province-hierarchy.js
          node automation/test-chapter-references.js
          node automation/test-audit-reports.js
          node automation/test-audit-reports-dom.js
          node automation/test-place-review.js
          node automation/test-place-review-dom.js
          node --test auth-backend/test-worker.mjs
          for file in updates/inbox/*.json; do
            [ -e "$file" ] || continue
            node automation/merge-revisions.js "$file"
            mkdir -p updates/processed
            git mv "$file" "updates/processed/$(basename "$file" .json)-${GITHUB_SHA}.json"
          done
          node automation/merge-revisions.js manual-revisions.json
          node automation/build-spatial-lab.js
          node automation/build-lab-times.js
          node automation/audit-place-space-sync.js
          node automation/test-current-lab-data.js
          node automation/test-corpus-store.js
          node automation/test-user-package-restoration.js
          node automation/test-yi-network.js
          node automation/test-spatial-route-consistency.js
          node automation/test-huangying-review.js
          node automation/test-publication-rebase.js
          node automation/test-route-coverage.js
          node automation/test-map-place-visibility.js

          node automation/test-place-node-merges.js
          node automation/test-movement-evidence-dedup.js
          node automation/test-otherworld-hierarchy.js
          node automation/test-unified-vocabulary.js
          node automation/test-manual-spatial-priority.js
          node automation/test-restored-place-examples.js
          node automation/test-network-freshness.js
          node automation/export-lab-place-levels.js
          node automation/test-place-level-colors.js
          node automation/test-hierarchy-network.js
          node automation/test-unmapped-regions.js
          node automation/test-deepseek-unmapped.js
          node automation/export-topic-input.js
          node automation/build-topic-model.js
          node automation/test-topic-places.js
          node automation/test-topic-places-dom.js
          node automation/test-lab-unified-data.js
          node automation/test-lab-consolidation.js
          node automation/test-research-integration.js
          node automation/test-network-analysis.js
          node automation/test-book-network-dom.js
          node automation/test-edge-reading.js
          node automation/test-place-spaces.js
          node automation/test-lab-otherworld.js
          node automation/test-place-spaces-dom.js
          node automation/test-space-vocabulary-reconcile.js
          node automation/test-chapter-spaces.js
          node automation/test-local-source.js
          node automation/build-analysis-reports.js
          node automation/test-analysis-reports.js
          node automation/test-attachment-space-otherworld.js
          node automation/test-attachment-space-otherworld-application.js
          node automation/test-data-loading.js
          node automation/test-chapter-filter.js
          node automation/test-chapter-search.js
          node automation/test-performance.js
          node automation/update-asset-versions.js
          node automation/test-site-audit.js
          node automation/test-lab-state.js
          node automation/test-lab-cache.js
          node automation/test-cloud-release.js
          python automation/test-release-cleanup.py
      - name: Build tutorial NetworkX analysis
        shell: bash
        run: |
          python -m pip install -r automation/requirements-network.txt
          node automation/export-network-input.js
          if node automation/test-tutorial-network.js; then
            echo "Existing network analysis matches all current graph signatures."
          else
            python automation/build-networkx.py
          fi
          node automation/test-tutorial-network.js
          node automation/test-tutorial-network-dom.js
          python automation/test-networkx.py
          python automation/finalize-cloud-release.py
      - name: Record regenerated release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/research-lab/map-runtime.js reports/place-space-sync-audit.json reports/place-space-sync-audit.md
          git add data.html assets/research-lab/index.html assets/research-lab/cases.html
          git add reports/analysis-reports-20261021.json reports/analysis-reports-20261021.md
          git add manual-revisions.json data-package.json index.html research-data.zip release-manifest.json assets/map-base.json assets/research-lab/data.json assets/research-lab/time-terms.json assets/research-lab/topics.json assets/research-lab/networkx-analysis.json assets/research-lab/place-levels.json reports/unmapped-place-equivalence-audit-20261019.json reports/unmapped-place-equivalence-audit-20261019.md
          if ! git diff --cached --quiet; then
            git commit -m "更新人工修订资料包与发布版本"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public artifact
        shell: bash
        run: |
          mkdir public
          cp index.html data.html data-package.json manual-revisions.json research-data.zip release-manifest.json github-sync.js github-login.js github-sync-config.json audit-reports.js public/
          cp -r assets public/assets
          mkdir -p public/reports
          cp reports/place-space-sync-audit.json reports/place-space-sync-audit.md reports/analysis-reports-20261021.json reports/analysis-reports-20261021.md reports/attachment-space-otherworld-audit-20261021.json reports/attachment-space-otherworld-audit-20261021.md reports/attachment-space-otherworld-application-20261021.json public/reports/
          cp reports/unified-migration-verification-20261020.json public/reports/
          cp reports/space-vocabulary-20261022.json public/reports/
          cp reports/huangying-review-20261024.json reports/huangying-review-20261024.md public/reports/
          cp reports/unmapped-region-review-20261021.json public/reports/
          cp reports/unmapped-changes-20261021.md reports/unmapped-changes-20261021.json public/reports/
          cp reports/otherworld-hierarchy-review-20261021.md reports/otherworld-hierarchy-review-20261021.json public/reports/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
